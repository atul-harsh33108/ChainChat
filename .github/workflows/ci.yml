name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, auth-service, workflow-service, execution-service, billing-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv services/${{ matrix.service }}/.venv
          services/${{ matrix.service }}/.venv/bin/pip install -r services/${{ matrix.service }}/requirements.txt
          services/${{ matrix.service }}/.venv/bin/pip install -r services/${{ matrix.service }}/requirements-dev.txt
      - name: Lint with ruff
        run: services/${{ matrix.service }}/.venv/bin/ruff check services/${{ matrix.service }}/src
      - name: Type check with mypy
        run: services/${{ matrix.service }}/.venv/bin/mypy services/${{ matrix.service }}/src
      - name: Test with pytest
        run: services/${{ matrix.service }}/.venv/bin/pytest services/${{ matrix.service }}/tests

  lint-and-test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: cd apps/web && npm ci
      - run: cd apps/web && npm run lint
      - run: cd apps/web && npm run format:check
      - run: cd apps/web && npm run test
      - run: cd apps/web && npm run build
