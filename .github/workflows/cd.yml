name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push Docker images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          for svc in gateway auth-service workflow-service execution-service billing-service notification-service; do
            docker build -t $ECR_REGISTRY/chainchat/$svc:latest ./services/$svc
            docker push $ECR_REGISTRY/chainchat/$svc:latest
          done
          docker build -t $ECR_REGISTRY/chainchat/web:latest ./apps/web
          docker push $ECR_REGISTRY/chainchat/web:latest
      - name: Deploy to ECS
        run: |
          for svc in gateway auth-service workflow-service execution-service billing-service notification-service; do
            aws ecs update-service --cluster chainchat --service $svc --force-new-deployment
          done
