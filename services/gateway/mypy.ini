# Run from this directory: `.venv/bin/mypy .` (same as the Makefile and CI).
#
# `src/__init__.py` makes `src` a regular package, so every module has exactly
# one fully-qualified name (`src.<service>.*`). Without it, the same file was
# discovered twice (`<service>.*` and `src.<service>.*`) or imports were
# unresolvable, depending on the invocation directory — that broke CI (BUG-04).
[mypy]
python_version = 3.12
mypy_path = .
explicit_package_bases = true
# Several runtime deps (python-jose, rq, …) ship no type information; still
# type-check all first-party code.
ignore_missing_imports = true